name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android example build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the example with the native SDK from JitPack
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: iOS example build (Swift Package Manager)
    runs-on: macos-latest
    steps:
      # The checkout directory must be named like the Dart package: Flutter names the plugin's Swift package
      # symlink after it, and Xcode rejects an identity other than the package directory (flutter/flutter#186881).
      - uses: actions/checkout@v4
        with:
          path: onetrace_flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the example for the simulator with the native SDK as a Swift package
        working-directory: onetrace_flutter/example
        run: flutter build ios --simulator --debug
